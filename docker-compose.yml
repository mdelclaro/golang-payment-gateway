services:
  gateway:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      bank:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8090"
      BANK_API_URL: "http://bank:8080"
      DATABASE_URL: "postgres://payment:payment@postgres:5432/payment?sslmode=disable"
    ports:
      - "8090:8090"

  bank:
    build:
      context: .
      target: bank-simulator
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payment
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - payment_data:/var/lib/postgresql/data

volumes:
  payment_data:
