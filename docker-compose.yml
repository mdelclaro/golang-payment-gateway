services:
  gateway:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8090"
      BANK_API_URL: "${BANK_API_URL:-http://host.docker.internal:8080}"
      DATABASE_URL: "postgres://payment:payment@postgres:5432/payment?sslmode=disable"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8090:8090"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payment
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - payment_data:/var/lib/postgresql/data

volumes:
  payment_data:
